name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: netro-linux-x64
            archive: tar.gz
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: netro-linux-arm64
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: netro-windows-x64.exe
            archive: zip
          - os: macos-13
            target: x86_64-apple-darwin
            artifact: netro-macos-x64
            archive: tar.gz
          - os: macos-14
            target: aarch64-apple-darwin
            artifact: netro-macos-arm64
            archive: tar.gz
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --all-features --target ${{ matrix.target }}
      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          BIN="target/${{ matrix.target }}/release/netro"
          cp "$BIN" "dist/${{ matrix.artifact }}"
          chmod +x "dist/${{ matrix.artifact }}"
          "$BIN" version > dist/VERSION.txt
          tar -C dist -czf "${{ matrix.artifact }}.tar.gz" "${{ matrix.artifact }}" VERSION.txt
      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/netro.exe" "dist/${{ matrix.artifact }}"
          & "dist/${{ matrix.artifact }}" version | Out-File -Encoding utf8 dist/VERSION.txt
          Compress-Archive -Path "dist/${{ matrix.artifact }}", "dist/VERSION.txt" -DestinationPath "${{ matrix.artifact }}.zip"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.${{ matrix.archive }}
          if-no-files-found: error

  publish:
    name: Publish release
    needs: release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**
          generate_release_notes: true
